<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen AI - Alan</title>
    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 15px; background: #151515; text-align: center; border-bottom: 1px solid #00ff88; color: #00ff88; font-weight: bold; letter-spacing: 1px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .user { background: #00ff88; color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .ai { background: #222; align-self: flex-start; border: 1px solid #333; border-bottom-left-radius: 2px; }
        #input-area { padding: 15px; background: #151515; display: flex; gap: 8px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        button { background: #00ff88; color: #000; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #444; color: #888; }
        #status { font-size: 11px; color: #00ff88; text-align: center; padding: 5px; background: #000; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="header">QWEN 2.5 MOBILE SYSTEM</div>
    <div id="status">Mengaktifkan sistem...</div>

    <div id="chat-container" id="chatBox">
        <div class="msg ai">Menyiapkan otak Qwen... (Tunggu sebentar ya, Lan)</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Loading model..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>KIRIM</button>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers';

        let chatbot;
        const status = document.getElementById('status');
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chat-container');

        async function init() {
            try {
                status.innerText = "Status: Downloading Qwen-0.5B (Ringan)...";
                
                // Memanggil Qwen 2.5 versi paling kecil & pinter
                chatbot = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct');

                status.innerText = "Status: Online";
                input.disabled = false;
                input.placeholder = "Tanya apa saja ke Qwen...";
                btn.disabled = false;
                chatBox.innerHTML += `<div class="msg ai">Qwen sudah siap! Ukurannya kecil tapi otaknya encer. Silakan chat, Alan!</div>`;
            } catch (err) {
                status.innerText = "Status: Gagal Load!";
                console.error(err);
            }
        }

        window.sendMessage = async () => {
            const text = input.value.trim();
            if (!text || btn.disabled) return;

            // Tampilkan pesan user
            const uDiv = document.createElement('div');
            uDiv.className = 'msg user';
            uDiv.innerText = text;
            chatBox.appendChild(uDiv);
            
            input.value = '';
            btn.disabled = true;
            status.innerText = "Status: Qwen sedang berpikir...";

            try {
                const results = await chatbot(text, { 
                    max_new_tokens: 100,
                    temperature: 0.7,
                    top_p: 0.9
                });

                const aiText = results[0].generated_text.replace(text, "").trim();
                
                const aDiv = document.createElement('div');
                aDiv.className = 'msg ai';
                aDiv.innerText = aiText || "Maaf Lan, aku agak bingung jawabnya.";
                chatBox.appendChild(aDiv);
            } catch (e) {
                console.error(e);
            }

            btn.disabled = false;
            status.innerText = "Status: Online";
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        init();
    </script>
</body>
</html>
