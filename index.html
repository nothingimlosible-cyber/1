<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Intelligence - Alan</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #status { font-size: 11px; color: #888; text-align: center; padding: 10px; background: #0a0a0a; border-bottom: 1px solid #222; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .input-area { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #1a73e8; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .msg { padding: 12px; border-radius: 12px; max-width: 85%; font-size: 15px; }
        .user { background: #1a73e8; align-self: flex-end; }
        .ai { background: #262626; align-self: flex-start; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="status">MEMBACA MEMORI LOKAL...</div>
<div id="chat"><div class="msg ai">Sistem Aktif. Alan, aku sudah ada di dalam repo kamu.</div></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Tanya Core Intelligence..." autocomplete="off">
    <button id="sendBtn" disabled>MEMUAT...</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // WAJIB: Paksa sistem hanya melihat folder lokal kamu
    env.allowRemoteModels = false;
    env.localModelPath = './'; 

    let model = null;
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');

    async function inisialisasi() {
        try {
            status.innerText = "MENGAKSES FOLDER brain (26.12 MB)...";
            
            // Langsung panggil folder 'brain' yang isinya config.json kamu
            model = await pipeline('text-generation', 'brain', {
                quantized: true,
                model_file_name: 'onnx/model_quantized.onnx' 
            });

            status.innerText = "CORE INTELLIGENCE: ONLINE";
            btn.disabled = false;
            btn.innerText = "KIRIM";
        } catch (e) {
            status.innerText = "GAGAL: " + e.message;
            console.error("Detail Error:", e);
        }
    }
    inisialisasi();

    async function kirim() {
        const text = input.value.trim();
        if (!text || !model) return;

        appendMsg(text, 'user');
        input.value = '';
        const aiMsg = appendMsg("...", 'ai');

        try {
            // Prompt khusus biar dia tahu dia asisten kamu
            const prompt = `<|im_start|>system\nKamu asisten cerdas Alan.\n<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            const out = await model(prompt, { max_new_tokens: 100, temperature: 0.7 });
            aiMsg.innerText = out[0].generated_text.split('assistant\n')[1]?.trim() || "Hmm, ada yang salah.";
        } catch (err) {
            aiMsg.innerText = "Memori penuh, coba refresh.";
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function appendMsg(t, s) {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    btn.onclick = kirim;
    input.onkeypress = (e) => { if(e.key === 'Enter') kirim(); };
</script>
</body>
</html>
