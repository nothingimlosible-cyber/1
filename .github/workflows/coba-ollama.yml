name: Gas Ollama Alan
on: [push, workflow_dispatch]

jobs:
  eksekusi:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil File
        uses: actions/checkout@v4

      - name: Pasang Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Tes Robotnya
        run: |
          # 1. Nyalakan mesin (server)
          ollama serve & 
          
          # 2. Tunggu 5 detik biar siap
          sleep 5 
          
          # 3. Langsung suruh jawab (pake model kecil biar cepet)
          ollama run tinydolphin "Halo, ini Alan. Kamu sudah siap?"
