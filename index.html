<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Intelligence - Alan</title>
    <style>
        body { background: #0b0b0b; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .input-area { padding: 15px; background: #161616; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #222; color: #fff; outline: none; padding-left: 20px; }
        button { padding: 12px 25px; background: #1a73e8; border: none; color: #fff; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #555; }
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 85%; line-height: 1.5; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user { background: #1a73e8; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .ai { background: #2d2d2d; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3c3c3c; }
        #status { font-size: 11px; color: #888; text-align: center; padding: 10px; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="status">SISTEM MEMUAI...</div>
<div id="chat">
    <div class="msg ai">Sistem Aktif. Selamat datang, Alan. Apa yang ingin kamu diskusikan hari ini?</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Tulis pesan..." autocomplete="off">
    <button id="sendBtn" disabled>MUAT...</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // PENTING: Arahkan ke folder 'brain' hasil Action kamu tadi
    env.allowRemoteModels = false;
    env.localModelPath = './';

    let model = null;
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');

    async function initAI() {
        try {
            status.innerText = "MENGAKSES MEMORI LOKAL (26MB)...";
            // Memanggil folder 'brain' dan file onnx di dalamnya
            model = await pipeline('text-generation', 'brain', {
                quantized: true,
                model_file_name: 'onnx/model_quantized.onnx'
            });
            status.innerText = "CORE INTELLIGENCE: ONLINE";
            btn.disabled = false;
            btn.innerText = "KIRIM";
        } catch (e) {
            status.innerText = "ERROR: GAGAL MENGAKSES OTAK.";
            console.error(e);
        }
    }
    initAI();

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || !model) return;

        appendMsg(text, 'user');
        input.value = '';
        const aiMsg = appendMsg("Sedang berpikir...", 'ai');
        chat.scrollTop = chat.scrollHeight;

        try {
            // Template prompt agar AI tahu identitasnya
            const prompt = `<|im_start|>system\nKamu adalah Core Intelligence, asisten cerdas Alan. Jawab dengan singkat dan padat.\n<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            
            const out = await model(prompt, { 
                max_new_tokens: 100, 
                temperature: 0.7,
                repetition_penalty: 1.1 
            });

            const hasil = out[0].generated_text.split('assistant\n')[1]?.trim() || "Maaf Lan, aku kehilangan fokus.";
            aiMsg.innerText = hasil;
        } catch (err) {
            aiMsg.innerText = "Sistem sibuk. Coba lagi, Lan.";
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function appendMsg(t, s) {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    btn.onclick = sendMessage;
    input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>

</body>
</html>
