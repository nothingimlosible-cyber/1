name: Download AI Model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ambil-otak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Otak (Tanpa Login)
        run: |
          mkdir -p brain/onnx
          # Kita ambil dari mirror JSDelivr yang gak minta password
          echo "Download Config..."
          curl -L "https://cdn.jsdelivr.net/gh/xenova/transformers.js@main/models/Xenova/SmolLM-135M-Instruct/config.json" -o brain/config.json
          
          echo "Download Tokenizer..."
          curl -L "https://cdn.jsdelivr.net/gh/xenova/transformers.js@main/models/Xenova/SmolLM-135M-Instruct/tokenizer.json" -o brain/tokenizer.json
          curl -L "https://cdn.jsdelivr.net/gh/xenova/transformers.js@main/models/Xenova/SmolLM-135M-Instruct/tokenizer_config.json" -o brain/tokenizer_config.json
          
          echo "Download Model Utama (26MB)..."
          # Jalur khusus JSDelivr biar gak korup
          curl -L "https://cdn.jsdelivr.net/gh/xenova/transformers.js@main/models/Xenova/SmolLM-135M-Instruct/onnx/model_quantized.onnx" -o brain/onnx/model_quantized.onnx
          
          echo "Cek hasil:"
          ls -lh brain/onnx/
          
      - name: Push Ke Repo
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add .
          git commit -m "Update otak asli (MB bukan bytes)" || exit 0
          git push
