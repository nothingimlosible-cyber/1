<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Alan System</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        #header { padding: 15px; background: #111; border-bottom: 2px solid #007bff; text-align: center; font-weight: bold; color: #007bff; text-transform: uppercase; letter-spacing: 2px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 85%; font-size: 15px; line-height: 1.5; position: relative; }
        .user { background: #007bff; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .ai { background: #222; align-self: flex-start; border: 1px solid #333; border-bottom-left-radius: 2px; }
        
        #input-area { padding: 15px; background: #111; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; }
        input:focus { border-color: #007bff; }
        
        button { background: #007bff; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        button:disabled { background: #444; cursor: not-allowed; }
        
        #status-bar { font-size: 11px; color: #666; text-align: center; padding: 5px; background: #000; }
        .loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ' .'; } 40% { content: ' ..'; } 60% { content: ' ...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body>

    <div id="header">Alan AI System</div>
    <div id="status-bar">Status: Menginisialisasi sistem...</div>

    <div id="chat-box" id="chatBox">
        <div class="msg ai">Sistem Aktif. Menghubungkan ke otak SmolLM...</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Tunggu sebentar..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>

    <script type="module">
        // Import library Transformers.js dari CDN (Gak perlu upload file berat ke GitHub)
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers';

        let chatbot;
        const status = document.getElementById('status-bar');
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chat-box');

        // Fungsi Load AI
        async function loadAI() {
            try {
                status.innerHTML = "Status: Mendownload Otak AI <span class='loading-dots'></span>";
                
                // Memanggil model SmolLM langsung dari server Hugging Face
                chatbot = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');

                status.innerText = "Status: Online (Siap Chat)";
                input.disabled = false;
                input.placeholder = "Ketik pesan di sini...";
                btn.disabled = false;
                
                addMessage("Sistem sudah pinter sekarang. Mau tanya apa, Alan?", 'ai');
            } catch (err) {
                console.error(err);
                status.innerText = "Status: Gagal terhubung!";
                addMessage("Waduh, koneksi ke otak AI terputus. Coba refresh ya.", 'ai');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.sendMessage = async () => {
            const text = input.value.trim();
            if (!text || btn.disabled) return;

            addMessage(text, 'user');
            input.value = '';
            btn.disabled = true;
            status.innerHTML = "Status: AI sedang berpikir <span class='loading-dots'></span>";

            try {
                const results = await chatbot(text, { 
                    max_new_tokens: 60,
                    temperature: 0.7,
                    repetition_penalty: 1.2
                });

                const aiText = results[0].generated_text.replace(text, "").trim();
                addMessage(aiText || "Aku bingung mau jawab apa...", 'ai');
            } catch (e) {
                addMessage("Maaf Alan, otaknya lagi nge-lag.", 'ai');
            }

            btn.disabled = false;
            status.innerText = "Status: Online (Siap Chat)";
        };

        // Jalankan loading saat web dibuka
        loadAI();
    </script>
</body>
</html>
