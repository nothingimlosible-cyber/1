<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Alan - Ringan</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 85%; font-size: 14px; }
        .user { background: #007bff; align-self: flex-end; }
        .ai { background: #333; align-self: flex-start; }
        #input-area { padding: 10px; background: #111; display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #444; background: #222; color: #fff; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        #status { font-size: 10px; text-align: center; color: #888; padding: 2px; }
    </style>
</head>
<body>

    <div id="chat-box">
        <div class="msg ai">Halo Alan! Sistem sudah diperbaiki biar enteng di HP. Coba tes chat yuk!</div>
    </div>
    <div id="status">Status: Ready</div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan...">
        <button onclick="askAI()">Kirim</button>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const status = document.getElementById('status');
            const text = input.value.trim();

            if (!text) return;

            // Tampilkan pesan kamu
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            status.innerText = "Sistem sedang berpikir...";

            try {
                // Kita pakai API publik yang gratis & ringan buat HP
                const response = await fetch(`https://api.simsimi.vn/v2/?text=${encodeURIComponent(text)}&lc=id`);
                const data = await response.json();
                
                let reply = data.result || "Maaf Alan, sistem lagi sibuk.";
                chatBox.innerHTML += `<div class="msg ai">${reply}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg ai">Error: Pastikan internet aktif ya!</div>`;
            }

            status.innerText = "Status: Ready";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
