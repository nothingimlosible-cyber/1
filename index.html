<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Intelligence</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-box { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #1a73e8; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; cursor: not-allowed; }
        .msg { padding: 12px; border-radius: 12px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user { background: #1a73e8; align-self: flex-end; }
        .ai { background: #222; align-self: flex-start; border: 1px solid #333; }
        #status { font-size: 11px; color: #666; text-align: center; padding: 5px; background: #080808; }
    </style>
</head>
<body>

<div id="status">MENGHUBUNGKAN KE MEMORI LOKAL...</div>
<div id="chat">
    <div class="msg ai">Sistem Aktif. Selamat datang, Alan.</div>
</div>

<div class="input-box">
    <input type="text" id="in" placeholder="Tanya Core Intelligence..." autocomplete="off">
    <button id="btn" disabled>LOAD...</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // WAJIB: Arahkan ke folder 'brain' di GitHub Pages kamu
    env.allowRemoteModels = false;
    env.localModelPath = './'; 

    let model = null;
    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    async function bangunkanAI() {
        try {
            status.innerText = "SEDANG MEMUAT OTAK (26MB)...";
            // Memanggil folder 'brain' yang isinya model asli kamu
            model = await pipeline('text-generation', 'brain', {
                quantized: true,
                model_file_name: 'onnx/model_quantized.onnx' 
            });
            status.innerText = "CORE INTELLIGENCE: ONLINE";
            btn.disabled = false;
            btn.innerText = "KIRIM";
        } catch (e) {
            status.innerText = "ERROR: GAGAL MEMBACA FILE MODEL.";
            console.error(e);
        }
    }
    bangunkanAI();

    async function kirim() {
        const text = input.value.trim();
        if (!text || !model) return;

        appendMsg(text, 'user');
        input.value = '';
        const aiMsg = appendMsg("...", 'ai');

        try {
            const prompt = `<|im_start|>system\nKamu Core Intelligence, asisten cerdas Alan.\n<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            
            const out = await model(prompt, { 
                max_new_tokens: 100, 
                temperature: 0.7 
            });

            aiMsg.innerText = out[0].generated_text.split('assistant\n')[1].trim();
        } catch (err) {
            aiMsg.innerText = "Sistem sibuk, coba lagi Lan.";
        }
    }

    function appendMsg(t, s) {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        d.innerText = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    btn.onclick = kirim;
    input.onkeypress = (e) => { if(e.key === 'Enter') kirim(); };
</script>

</body>
</html>
